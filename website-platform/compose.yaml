# Development database only. Do not expose PostgreSQL publicly.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: website
      POSTGRES_USER: website
      POSTGRES_PASSWORD: ${DB_PASSWORD:-local_only_change_me}
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - website_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U website -d website"]
      interval: 5s
      retries: 10
volumes:
  website_postgres:
