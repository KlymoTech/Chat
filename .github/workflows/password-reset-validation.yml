name: Password Reset Isolated Validation

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'backend/src/northstar_api/password_reset.py'
      - 'backend/src/northstar_api/password_reset_schemas.py'
      - 'backend/src/northstar_api/services/password_reset.py'
      - 'backend/src/northstar_api/routers/password_reset.py'
      - 'backend/src/northstar_api/routers/auth.py'
      - 'backend/src/northstar_api/dependencies.py'
      - 'backend/src/northstar_api/security.py'
      - 'backend/src/northstar_api/email_config.py'
      - 'backend/src/northstar_api/routers/__init__.py'
      - 'backend/src/northstar_api/password_reset.py'
      - 'backend/migrations/env.py'
      - 'backend/migrations/versions/0025_password_reset.py'
      - 'backend/tests/test_password_reset.py'
      - 'frontend/src/lib/password-reset-api.ts'
      - 'frontend/src/lib/password-reset-api.test.ts'
      - 'frontend/src/pages/ForgotPasswordPage.tsx'
      - 'frontend/src/pages/ResetPasswordPage.tsx'
      - 'frontend/src/pages/PasswordResetPage.test.tsx'
      - 'frontend/src/pages/LoginPage.tsx'
      - 'frontend/src/App.tsx'
      - '.github/workflows/password-reset-validation.yml'

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.8.17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install backend dependencies
        run: uv sync --all-groups
      - name: Ruff lint
        run: >-
          uv run ruff check
          src/northstar_api/password_reset.py
          src/northstar_api/password_reset_schemas.py
          src/northstar_api/services/password_reset.py
          src/northstar_api/routers/password_reset.py
          src/northstar_api/routers/auth.py
          src/northstar_api/dependencies.py
          src/northstar_api/security.py
          src/northstar_api/email_config.py
          migrations/env.py
          migrations/versions/0025_password_reset.py
          tests/test_password_reset.py
      - name: Ruff format check
        run: >-
          uv run ruff format --check
          src/northstar_api/password_reset.py
          src/northstar_api/password_reset_schemas.py
          src/northstar_api/services/password_reset.py
          src/northstar_api/routers/password_reset.py
          src/northstar_api/routers/auth.py
          src/northstar_api/dependencies.py
          src/northstar_api/security.py
          src/northstar_api/email_config.py
          migrations/env.py
          migrations/versions/0025_password_reset.py
          tests/test_password_reset.py
      - name: Mypy
        run: >-
          uv run mypy
          src/northstar_api/password_reset.py
          src/northstar_api/password_reset_schemas.py
          src/northstar_api/services/password_reset.py
          src/northstar_api/routers/password_reset.py
          src/northstar_api/routers/auth.py
          src/northstar_api/dependencies.py
          src/northstar_api/security.py
          src/northstar_api/email_config.py
      - name: Verify migration head
        run: uv run alembic heads | grep '0025_password_reset (head)'
      - name: Isolate unrelated Help router baseline blocker
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/northstar_api/routers/__init__.py')
          text = path.read_text()
          text = text.replace('    help,\n', '')
          text = text.replace('api_router.include_router(help.router)\n', '')
          path.write_text(text)
          PY
      - name: Password Reset + auth regression tests
        env:
          EMAIL_DELIVERY_MODE: log
          PASSWORD_RESET_FRONTEND_URL: http://localhost:5173/reset-password
          PASSWORD_RESET_TTL_MINUTES: '60'
        run: >-
          uv run pytest -q
          tests/test_password_reset.py
          tests/test_auth.py
          tests/test_signup.py
          tests/test_email_verification.py

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Feature ESLint
        run: >-
          npx eslint
          src/lib/password-reset-api.ts
          src/lib/password-reset-api.test.ts
          src/pages/ForgotPasswordPage.tsx
          src/pages/ResetPasswordPage.tsx
          src/pages/PasswordResetPage.test.tsx
          src/pages/LoginPage.tsx
          src/App.tsx
          --max-warnings 0
      - name: TypeScript
        run: npm run typecheck
      - name: Password Reset + auth regression tests
        run: >-
          npm test --
          src/lib/password-reset-api.test.ts
          src/pages/PasswordResetPage.test.tsx
          src/pages/SignupPage.test.tsx
          src/pages/VerifyEmailPage.test.tsx
      - name: Production build
        run: npm run build
