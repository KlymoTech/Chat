name: Figma frontend and API contracts
on:
  pull_request:
    paths:
      - 'frontend/**'
      - 'backend/**'
      - '.github/workflows/figma-contract-review.yml'
permissions:
  contents: read
concurrency:
  group: figma-contracts-${{ github.ref }}
  cancel-in-progress: true
jobs:
  frontend:
    name: Build and focused redesign regression tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with: {node-version: '22', cache: npm}
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck && npm run build
      - name: Dashboard, inbox selection, permissions and creation adapter
        run: >-
          npm run test --workspace @northstar/web --
          src/features/dashboard src/pages/AcademyDashboards.test.tsx
          src/pages/ConversationsSelection.test.tsx src/lib/attention-api.test.ts
          src/components/materialm/MaterialmAppShell.test.tsx
          src/components/ModalFocus.test.tsx src/components/ui.test.tsx
          src/pages/AgentsPage.test.tsx src/pages/AgentsPage.whatsapp.test.tsx
          --reporter=default --reporter=junit --outputFile=redesign-contract-results.xml
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: figma-frontend-contracts
          path: frontend/redesign-contract-results.xml
          if-no-files-found: warn
          retention-days: 14
  backend:
    name: Real FastAPI dashboard contracts (isolated SQLite)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      APP_ENV: test
      DATABASE_URL: sqlite+aiosqlite:///./northstar-test.db
      JWT_SECRET: ci-only-secret-with-at-least-32-characters
      ALLOW_DETERMINISTIC_EMBEDDINGS: 'true'
      RATE_LIMIT_FAIL_OPEN: 'true'
      CRM_CREDENTIAL_ENCRYPTION_KEY: ci-only-crm-credential-encryption-key-32chars
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with: {python-version: '3.12'}
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with: {enable-cache: true, cache-dependency-glob: backend/uv.lock}
      - run: uv sync --all-groups --locked
        working-directory: backend
      - name: Exercise actual routes, auth, workspace scope, database and serialization
        working-directory: backend
        run: uv run pytest -q tests/test_dashboard_api_contract.py --junitxml=dashboard-contract-results.xml
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: figma-backend-contracts
          path: backend/dashboard-contract-results.xml
          if-no-files-found: warn
          retention-days: 14
