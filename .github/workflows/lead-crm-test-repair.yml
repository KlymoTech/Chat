name: Lead CRM one-shot WhatsApp test repair

on:
  push:
    branches: [feature/lead-crm-omnichannel-platform]

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: feature/lead-crm-omnichannel-platform
      - name: Make unpublished-agent precondition explicit
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('backend/tests/test_whatsapp.py')
          text = path.read_text()
          needle = '''    assert created_agent.status_code == 201, created_agent.text\n    agent_id = created_agent.json()["id"]\n    draft_bootstrap = await client.get("/api/v1/integrations/whatsapp/bootstrap", headers=auth_headers)\n'''
          replacement = '''    assert created_agent.status_code == 201, created_agent.text\n    agent_id = created_agent.json()["id"]\n    drafted_agent = await client.patch(\n        f"/api/v1/agents/{agent_id}",\n        headers=auth_headers,\n        json={"status": "draft"},\n    )\n    assert drafted_agent.status_code == 200, drafted_agent.text\n    draft_bootstrap = await client.get("/api/v1/integrations/whatsapp/bootstrap", headers=auth_headers)\n'''
          if needle not in text:
              raise SystemExit('target WhatsApp lifecycle test block not found')
          path.write_text(text.replace(needle, replacement, 1))
          PY
      - name: Commit test correction
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/tests/test_whatsapp.py
          git commit -m 'test: make WhatsApp unpublished-agent precondition explicit'
          git push origin HEAD:feature/lead-crm-omnichannel-platform
