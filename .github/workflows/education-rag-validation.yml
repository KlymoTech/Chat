name: Authorized Education RAG Isolated Validation

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend-education-rag:
    runs-on: ubuntu-latest
    env:
      APP_ENV: test
      DATABASE_URL: sqlite+aiosqlite:///./education-rag-test.db
      JWT_SECRET: ci-only-secret-with-at-least-32-characters
      ALLOW_DETERMINISTIC_EMBEDDINGS: 'true'
      RATE_LIMIT_FAIL_OPEN: 'true'
      CRM_CREDENTIAL_ENCRYPTION_KEY: ci-only-crm-credential-encryption-key-32chars
      BACKGROUND_DISPATCH_ENABLED: 'false'
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Resolve backend environment
        run: uv sync --all-groups
      - name: Lint Education RAG surface
        run: >-
          uv run ruff check
          migrations/env.py
          migrations/versions/0022_education_knowledge_scope.py
          src/northstar_api/education_knowledge_scope.py
          src/northstar_api/education_knowledge_schemas.py
          src/northstar_api/services/education_knowledge.py
          src/northstar_api/services/education_rag.py
          src/northstar_api/services/education_chat.py
          src/northstar_api/services/retrieval.py
          src/northstar_api/routers/knowledge.py
          src/northstar_api/routers/chat.py
          src/northstar_api/routers/widget.py
          tests/test_education_rag.py
      - name: Format-check Education RAG surface
        run: >-
          uv run ruff format --check
          migrations/env.py
          migrations/versions/0022_education_knowledge_scope.py
          src/northstar_api/education_knowledge_scope.py
          src/northstar_api/education_knowledge_schemas.py
          src/northstar_api/services/education_knowledge.py
          src/northstar_api/services/education_rag.py
          src/northstar_api/services/education_chat.py
          src/northstar_api/services/retrieval.py
          src/northstar_api/routers/knowledge.py
          src/northstar_api/routers/chat.py
          src/northstar_api/routers/widget.py
          tests/test_education_rag.py
      - name: Type-check Education RAG service path
        run: >-
          uv run mypy
          src/northstar_api/education_knowledge_scope.py
          src/northstar_api/education_knowledge_schemas.py
          src/northstar_api/services/education_knowledge.py
          src/northstar_api/services/education_rag.py
          src/northstar_api/services/education_chat.py
          src/northstar_api/services/retrieval.py
          src/northstar_api/routers/knowledge.py
          src/northstar_api/routers/chat.py
          src/northstar_api/routers/widget.py
      - name: Verify migration head
        run: alembic heads | grep '0022_education_knowledge_scope (head)'
      - name: Isolate Education API from unrelated broken Help router
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/northstar_api/routers/__init__.py")
          content = path.read_text(encoding="utf-8")
          content = content.replace("    help,\n", "")
          content = content.replace("api_router.include_router(help.router)\n", "")
          path.write_text(content, encoding="utf-8")
          PY
      - name: Run Education RAG and prerequisite regressions
        run: >-
          uv run pytest
          tests/test_education_rag.py
          tests/test_education_runtime_authorization.py
          tests/test_education_channel_runtime.py
          tests/test_agent_purpose.py
          tests/test_education_enrollments.py
          tests/test_education_student_identities.py
          -q

  frontend-education-rag:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@1e60f620b9541d7c2437c6fbedb819011f0cc207
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Lint Education knowledge UI
        run: >-
          npx eslint
          src/components/education-knowledge-scope-manager.tsx
          src/components/education-knowledge-scope-manager.test.tsx
          src/lib/education-knowledge-api.ts
          src/pages/AgentBuilderPage.tsx
      - name: Type-check frontend
        run: npm run typecheck
      - name: Run Education knowledge UI regressions
        run: >-
          npm test --
          src/components/education-knowledge-scope-manager.test.tsx
          src/pages/AgentBuilderPurpose.test.tsx
      - name: Build frontend
        run: npm run build
