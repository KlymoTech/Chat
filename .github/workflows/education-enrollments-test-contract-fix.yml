name: Education Enrollments One-Time Test Contract Fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix-test-contracts:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
      - name: Align tests with standardized errors and Enrollment-aware activation
        run: |
          python - <<'PY'
          from pathlib import Path

          enrollment_test = Path('backend/tests/test_education_enrollments.py')
          content = enrollment_test.read_text(encoding='utf-8')
          old = 'assert "Reactivate the Student" in edit_archived_history.json()["detail"]'
          new = 'assert "Reactivate the Student" in edit_archived_history.json()["error"]["message"]'
          if old not in content:
              raise SystemExit('Archived Student PATCH assertion not found')
          content = content.replace(old, new, 1)
          old = 'assert "Reactivate the Student" in revoke_archived_history.json()["detail"]'
          new = 'assert "Reactivate the Student" in revoke_archived_history.json()["error"]["message"]'
          if old not in content:
              raise SystemExit('Archived Student DELETE assertion not found')
          enrollment_test.write_text(content.replace(old, new, 1), encoding='utf-8')

          purpose_test = Path('backend/tests/test_agent_purpose.py')
          content = purpose_test.read_text(encoding='utf-8')
          old = 'assert "Education agents remain draft" in unsafe_activation.text'
          new = 'assert "valid Student Enrollment" in unsafe_activation.json()["error"]["message"]'
          if old not in content:
              raise SystemExit('Agent Purpose activation assertion not found')
          purpose_test.write_text(content.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit corrected regression contracts
        run: |
          if git diff --quiet; then
            echo "No changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/tests/test_education_enrollments.py backend/tests/test_agent_purpose.py
          git commit -m "test: align education enrollment error contracts"
          git push origin HEAD:main
