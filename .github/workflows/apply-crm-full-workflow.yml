name: Apply CRM full workflow source

on:
  push:
    branches:
      - feature/crm-full-workflow
    paths:
      - .github/workflows/apply-crm-full-workflow.yml

permissions:
  contents: write

concurrency:
  group: apply-crm-full-workflow
  cancel-in-progress: false

jobs:
  apply:
    name: Apply complete CRM workflow implementation
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feature/crm-full-workflow
          fetch-depth: 0
          persist-credentials: true
      - name: Verify and apply source payload
        shell: bash
        run: |
          set -euo pipefail
          cat .crm-workflow-payload/part-* > /tmp/crm-full-workflow.b64
          base64 --decode /tmp/crm-full-workflow.b64 > /tmp/crm-full-workflow.tar.xz
          echo '7c927e2da8e05f20f47019a9a5bd36fe24874142158247a6222317b29f058578  /tmp/crm-full-workflow.tar.xz' | sha256sum --check
          tar -xJf /tmp/crm-full-workflow.tar.xz
          rm -rf .crm-workflow-payload .github/workflows/apply-crm-full-workflow.yml
          python -m compileall -q \
            backend/src/northstar_api/lead_crm/crm_workflow_schemas.py \
            backend/src/northstar_api/routers/crm_workflow.py \
            backend/src/northstar_api/services/crm_workflow.py \
            backend/tests/test_crm_workflow.py
          git diff --check
      - name: Commit complete delivery unit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'northstar-release-bot'
          git config user.email 'northstar-release-bot@users.noreply.github.com'
          git add -A
          git commit -m 'feat: complete end-to-end Lead-to-CRM workflow'
          git push origin HEAD:feature/crm-full-workflow
