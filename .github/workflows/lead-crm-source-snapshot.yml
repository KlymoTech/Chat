name: Lead CRM source snapshot

on:
  push:
    branches: [feature/lead-crm-omnichannel-platform]
    paths: [.github/workflows/lead-crm-source-snapshot.yml]

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22.13.0'
      - name: Install exact locked development dependencies
        run: |
          uv sync --project backend --all-groups --locked --python 3.13
          npm ci --no-audit --no-fund
      - name: Archive tracked source and installed packages only
        run: |
          git archive --format=tar --output="$RUNNER_TEMP/lead-crm-source.tar" HEAD
          tar -czf "$RUNNER_TEMP/lead-crm-python-packages.tar.gz" -C backend/.venv/lib/python3.13/site-packages .
          tar -czf "$RUNNER_TEMP/lead-crm-node-packages.tar.gz" node_modules
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: lead-crm-offline-verification
          path: |
            ${{ runner.temp }}/lead-crm-source.tar
            ${{ runner.temp }}/lead-crm-python-packages.tar.gz
            ${{ runner.temp }}/lead-crm-node-packages.tar.gz
          retention-days: 1
          if-no-files-found: error
