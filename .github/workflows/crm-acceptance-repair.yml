name: CRM acceptance repair

on:
  push:
    branches: [feature/lead-crm-omnichannel-platform]
    paths:
      - .github/workflows/crm-acceptance-repair.yml
      - scripts/_crm_acceptance_patch.py
      - backend/tests/test_crm_acceptance.py
      - backend/src/northstar_api/lead_crm/verification.py
      - backend/src/northstar_api/lead_crm/connection_context.py

permissions:
  contents: write

concurrency:
  group: crm-acceptance-repair
  cancel-in-progress: false

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      APP_ENV: test
      DATABASE_URL: sqlite+aiosqlite:///./northstar-test.db
      JWT_SECRET: ci-only-secret-with-at-least-32-characters
      ALLOW_DETERMINISTIC_EMBEDDINGS: 'true'
      RATE_LIMIT_FAIL_OPEN: 'true'
      CRM_CREDENTIAL_ENCRYPTION_KEY: ci-only-crm-credential-encryption-key-32chars
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
      - name: Apply reviewed exact-match patch
        run: |
          python scripts/_crm_acceptance_patch.py
          python - <<'PY'
          from pathlib import Path
          path = Path('backend/tests/test_crm_acceptance.py')
          text = path.read_text()
          path.write_text(text.replace('async def wait_for(awaitable, timeout):', 'async def wait_for(awaitable, **kwargs):'))
          PY
      - name: Install locked dependencies
        working-directory: backend
        run: uv sync --all-groups --locked --quiet
      - name: Lint and format source
        working-directory: backend
        run: |
          uv run ruff check . --fix
          uv run ruff format .
      - name: Strict type checking
        working-directory: backend
        run: uv run mypy src
      - name: Full backend regression and CRM acceptance tests
        working-directory: backend
        run: uv run pytest --junitxml=crm-acceptance-results.xml
      - name: Publish only verified source changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/src backend/migrations backend/tests compose.yaml kubernetes/base
          git diff --cached --stat
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'fix: verify CRM acknowledgement, retries and runtime wiring'
          git push origin HEAD:feature/lead-crm-omnichannel-platform
      - name: Retain test evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: crm-acceptance-results
          path: backend/crm-acceptance-results.xml
          if-no-files-found: warn
          retention-days: 14
