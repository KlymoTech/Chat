# Temporary read-only source capture for the isolated redesign review.
name: Figma source snapshot
on:
  pull_request:
    paths:
      - .github/workflows/figma-source-snapshot.yml
permissions:
  contents: read
jobs:
  snapshot:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feat/figma-saas-bot-redesign'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Archive tracked source only, without Git credentials or runtime files
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/figma-source-review
          git archive --format=tar.gz "$HEAD_SHA" > /tmp/figma-source-review/head.tar.gz
          git archive --format=tar.gz "$BASE_SHA" > /tmp/figma-source-review/base.tar.gz
          printf '{"head":"%s","base":"%s"}\n' "$HEAD_SHA" "$BASE_SHA" > /tmp/figma-source-review/commits.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: figma-source-review
          path: /tmp/figma-source-review/
          retention-days: 3
          if-no-files-found: error
