name: Lead CRM one-shot type fix

on:
  push:
    branches:
      - feature/lead-crm-omnichannel-platform

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      APP_ENV: test
      DATABASE_URL: sqlite+aiosqlite:///./northstar-test.db
      JWT_SECRET: ci-only-secret-with-at-least-32-characters
      ALLOW_DETERMINISTIC_EMBEDDINGS: 'true'
      RATE_LIMIT_FAIL_OPEN: 'true'
      CRM_CREDENTIAL_ENCRYPTION_KEY: ci-only-crm-credential-encryption-key-32chars
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: feature/lead-crm-omnichannel-platform
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with: {python-version: '3.12'}
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: cd backend && uv sync --all-groups --locked
      - name: Apply final type-safe narrowings
        run: |
          python - <<'PY'
          from pathlib import Path

          zoho = Path('backend/src/northstar_api/lead_crm/providers/zoho.py')
          text = zoho.read_text()
          text = text.replace(
              'details = result.get("details") if isinstance(result.get("details"), dict) else {}\n        record_id = details.get("id")',
              'details_value = result.get("details")\n        details: dict[str, Any] = dict(details_value) if isinstance(details_value, dict) else {}\n        record_id = details.get("id")',
          )
          zoho.write_text(text)

          services = Path('backend/src/northstar_api/lead_crm/services.py')
          text = services.read_text()
          if 'from typing import Any, cast' not in text:
              text = text.replace('from typing import Any', 'from typing import Any, cast')
          text = text.replace('            return profile\n        session.add(', '            return cast(LeadProfile, profile)\n        session.add(', 1)
          text = text.replace('        return profile\n\n    async def qualify', '        return cast(LeadProfile, profile)\n\n    async def qualify', 1)
          services.write_text(text)

          worker = Path('backend/src/northstar_api/workers/crm_delivery_worker.py')
          text = worker.read_text()
          text = text.replace('    return max(1, base + secrets.randbelow(jitter_max + 1))', '    return int(max(1, base + secrets.randbelow(jitter_max + 1)))')
          text = text.replace('        attempt = await session.scalar(\n            select(CRMDeliveryAttempt).where(', '        stored_attempt = await session.scalar(\n            select(CRMDeliveryAttempt).where(', 1)
          text = text.replace('        if attempt:\n            attempt.finished_at = now\n            attempt.http_status = result.http_status\n            attempt.latency_ms = int((time.monotonic() - started) * 1000)\n            attempt.result_status = "acknowledged"\n            attempt.provider_request_id = result.provider_request_id', '        if stored_attempt:\n            stored_attempt.finished_at = now\n            stored_attempt.http_status = result.http_status\n            stored_attempt.latency_ms = int((time.monotonic() - started) * 1000)\n            stored_attempt.result_status = "acknowledged"\n            stored_attempt.provider_request_id = result.provider_request_id', 1)
          # The second scalar lookup is in the error path; use a distinct optional variable there too.
          marker = '        attempt = await session.scalar(\n            select(CRMDeliveryAttempt).where('
          if marker in text:
              text = text.replace(marker, '        stored_attempt = await session.scalar(\n            select(CRMDeliveryAttempt).where(', 1)
              text = text.replace('        if attempt:\n            attempt.finished_at = now', '        if stored_attempt:\n            stored_attempt.finished_at = now', 1)
              text = text.replace('            attempt.http_status = error.http_status\n            attempt.latency_ms', '            stored_attempt.http_status = error.http_status\n            stored_attempt.latency_ms', 1)
              text = text.replace('            attempt.result_status = target.value\n            attempt.error_code', '            stored_attempt.result_status = target.value\n            stored_attempt.error_code', 1)
              text = text.replace('            attempt.error_message = str(error)[:1000]', '            stored_attempt.error_message = str(error)[:1000]', 1)
          worker.write_text(text)

          chat = Path('backend/src/northstar_api/services/chat.py')
          text = chat.read_text()
          text = text.replace('            return await translator(question, agent.language, agent.model_profile)', '            translated = await translator(question, agent.language, agent.model_profile)\n            return str(translated)')
          chat.write_text(text)
          PY
          cd backend
          uv run ruff check . --fix
          uv run ruff format .
          uv run mypy src
      - name: Commit verified type fixes
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend
          git commit -m 'fix: satisfy strict typing for Lead CRM integrations'
          git push origin HEAD:feature/lead-crm-omnichannel-platform
