# Temporary exact-hash source transfer; removed by its own branch-only commit.
name: Apply verified Figma review fixes
on:
  pull_request:
    paths:
      - '.github/workflows/apply-figma-review-once.yml'
permissions:
  contents: read
jobs:
  apply:
    if: github.event.pull_request.number == 134 && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feat/figma-saas-bot-redesign'
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Apply only the four reviewed edits and verify exact resulting blobs
        run: |
          python3 - <<'PY'
          import hashlib
          from pathlib import Path
          expected = {
              'frontend/src/features/dashboard/SaasBotOverview.tsx': ('01ce647a367b1eab58d0350ac265261b939c688d', 'd1f6eccd26aba50ef02633dca30a09343c10ac23'),
              'frontend/src/features/dashboard/SaasBotOverview.test.tsx': ('8ef4c98a3e1c268e99ca076bd7583fdfbcb3eefe', 'b56a701dca2bfb0bcc7070739de51d993836f37c'),
              'frontend/src/pages/AcademyDashboards.test.tsx': ('2a0f16907f50d715fdcf4f0bfe84c87cc8d3227f', 'a6da18d06c121284e0295b0d2fdf9c19a235bf17'),
              'frontend/src/pages/ConversationsPage.tsx': ('54193cad80e689c43b1097374e89b7d708e8b6d9', '57a12614f625c63c80186d174aa92f77e2169764'),
          }
          def blob(value):
              return hashlib.sha1(f'blob {len(value)}\0'.encode() + value).hexdigest()
          changes = {}
          for path, (before, after) in expected.items():
              original = Path(path).read_bytes()
              assert blob(original) == before, f'Concurrent or unexpected change: {path}'
              text = original.decode()
              if path.endswith('SaasBotOverview.tsx'):
                  text = text.replace("import { api } from '@/lib/api';", "import { api } from '@/lib/api';\nimport { loadAttentionConversations } from '@/lib/attention-api';")
                  text = text.replace('canInbox ? api.conversations.list()', 'canInbox ? loadAttentionConversations()')
              elif path.endswith('.test.tsx'):
                  text = text.replace('afterEach(cleanup);', "vi.mock('@/lib/attention-api', () => ({ loadAttentionConversations: mocks.conversations }));\nafterEach(cleanup);")
              else:
                  text = text.replace("const [reply, setReply] = useState('');", "const [replyDraft, setReplyDraft] = useState({ scope: '', value: '' });")
                  text = text.replace('  const selected = detail.data ?? selectedSummary;', "  // Polling retains its last result. Never display or act on another selection.\n  const selected = showingList ? null : detail.data?.id === selectedId ? detail.data : selectedSummary;\n  const draftScope = `${activeWorkspace?.id ?? ''}:${selectedId ?? ''}`;\n  const reply = replyDraft.scope === draftScope ? replyDraft.value : '';\n  const setReply = (value: string) => setReplyDraft({ scope: draftScope, value });")
                  text = text.replace("    if ((!selectedParam || !conversations.some((item) => item.id === selectedParam)) && conversations[0]) {\n      setParams({ selected: conversations[0].id }, { replace: true });\n    }", "    // The requested detail may legitimately be outside the first 100 list rows.\n    if (!selectedParam && conversations[0]) {\n      const next = new URLSearchParams(params);\n      next.set('selected', conversations[0].id);\n      setParams(next, { replace: true });\n    }")
                  text = text.replace('} /> : <div className="conversation-empty"><MessageCircle /><h3>Select a conversation</h3>', '} /> : selectedId ? <div className="conversation-empty" role={detail.error ? \'alert\' : \'status\'}>\n      <MessageCircle /><h3>{detail.error ? \'Conversation is unavailable\' : \'Loading conversation…\'}</h3>\n      {detail.error ? <><p>{detail.error}</p><Button variant="secondary" onClick={detail.reload}>Try again</Button></> : <p>Retrieving the selected conversation.</p>}\n    </div> : <div className="conversation-empty"><MessageCircle /><h3>Select a conversation</h3>')
              assert blob(text.encode()) == after, f'Transfer verification failed: {path}'
              changes[path] = text
          # Verify added source files are exactly the locally tested versions.
          for path, expected_blob in {
              'frontend/src/lib/attention-api.ts': '8c396df48b20ffe4226323cf2c43061728199fd5',
              'frontend/src/lib/attention-api.test.ts': 'a0e55b50be4786384ceb34a44d79fd0c5dce54af',
              'frontend/src/pages/ConversationsSelection.test.tsx': '6fcd6710bc7d4f1b4ab74c01748204584ee234c8',
              'backend/tests/test_dashboard_api_contract.py': 'da8e971282d5d18b3a3ee6976f9414844c6f1736',
              '.github/workflows/figma-contract-review.yml': '43086050451918d46f1dc63b169a6dab3b5d46cd',
          }.items():
              assert blob(Path(path).read_bytes()) == expected_blob, f'Added file differs: {path}'
          for path, text in changes.items():
              Path(path).write_text(text)
          Path('.github/workflows/figma-source-snapshot.yml').unlink()
          Path('.github/workflows/apply-figma-review-once.yml').unlink()
          PY
          git diff --check
          git add -- frontend/src/features/dashboard/SaasBotOverview.tsx frontend/src/features/dashboard/SaasBotOverview.test.tsx frontend/src/pages/AcademyDashboards.test.tsx frontend/src/pages/ConversationsPage.tsx .github/workflows/figma-source-snapshot.yml .github/workflows/apply-figma-review-once.yml
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' -c core.hooksPath=/dev/null commit -m 'fix: preserve inbox selection and load unresolved attention queues before pagination'
      - name: Fast-forward only the requested feature branch, never main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          HEADER=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          echo "::add-mask::$HEADER"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $HEADER" push origin HEAD:refs/heads/feat/figma-saas-bot-redesign
