name: Course Knowledge Validation

on:
  push:
    branches: [feature/course-aware-knowledge-20260917]
    paths:
      - '.github/workflows/course-knowledge-validation.yml'
      - 'backend/**'
      - 'frontend/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-snapshot:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Package tracked source for isolated validation
        run: git archive --format=tar HEAD > source.tar
      - uses: actions/upload-artifact@v4
        with:
          name: course-knowledge-source
          path: source.tar
          retention-days: 1
