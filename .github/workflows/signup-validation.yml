name: Self-Service Signup Isolated Validation

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend-signup:
    runs-on: ubuntu-latest
    env:
      APP_ENV: test
      DATABASE_URL: sqlite+aiosqlite:///./signup-test.db
      JWT_SECRET: ci-only-secret-with-at-least-32-characters
      ALLOW_DETERMINISTIC_EMBEDDINGS: 'true'
      RATE_LIMIT_FAIL_OPEN: 'true'
      CRM_CREDENTIAL_ENCRYPTION_KEY: ci-only-crm-credential-encryption-key-32chars
      BACKGROUND_DISPATCH_ENABLED: 'false'
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Resolve backend environment
        run: uv sync --all-groups
      - name: Lint signup backend
        run: >-
          uv run ruff check
          src/northstar_api/signup_schemas.py
          src/northstar_api/services/signup.py
          src/northstar_api/routers/auth.py
          tests/test_signup.py
      - name: Format-check signup backend
        run: >-
          uv run ruff format --check
          src/northstar_api/signup_schemas.py
          src/northstar_api/services/signup.py
          src/northstar_api/routers/auth.py
          tests/test_signup.py
      - name: Type-check signup backend
        run: >-
          uv run mypy
          src/northstar_api/signup_schemas.py
          src/northstar_api/services/signup.py
          src/northstar_api/routers/auth.py
      - name: Isolate signup API from unrelated broken Help router
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/northstar_api/routers/__init__.py")
          content = path.read_text(encoding="utf-8")
          content = content.replace("    help,\n", "")
          content = content.replace("api_router.include_router(help.router)\n", "")
          path.write_text(content, encoding="utf-8")
          PY
      - name: Run signup and auth regressions
        run: >-
          uv run pytest
          tests/test_signup.py
          tests/test_api.py
          -k 'signup or health_and_auth_contract or refresh_rotation or refresh_cookie or login_rate_limit'
          -q

  frontend-signup:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@1e60f620b9541d7c2437c6fbedb819011f0cc207
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Lint signup frontend
        run: >-
          npx eslint
          src/lib/signup-api.ts
          src/lib/signup-api.test.ts
          src/components/providers.tsx
          src/pages/SignupPage.tsx
          src/pages/SignupPage.test.tsx
          src/pages/LoginPage.tsx
          src/App.tsx
      - name: Type-check frontend
        run: npm run typecheck
      - name: Run signup UI and client tests
        run: >-
          npm test --
          src/pages/SignupPage.test.tsx
          src/lib/signup-api.test.ts
      - name: Build frontend
        run: npm run build
