name: Education Enrollments One-Time Format

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  format-enrollment-backend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Format Enrollment Python files with Ruff
        working-directory: backend
        run: |
          uv sync --all-groups
          uv run ruff format \
            src/northstar_api/routers/agents.py \
            src/northstar_api/education_enrollments.py \
            tests/test_education_enrollments.py
      - name: Commit Ruff formatting if needed
        run: |
          if git diff --quiet; then
            echo "No formatting changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/src/northstar_api/routers/agents.py backend/src/northstar_api/education_enrollments.py backend/tests/test_education_enrollments.py
          git commit -m "style: format education enrollment backend"
          git push origin HEAD:main
