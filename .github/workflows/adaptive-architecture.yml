name: Adaptive architecture branch gate

on:
  push:
    branches:
      - feature/northstar-adaptive-architecture-20261008
  pull_request:
    paths:
      - 'backend/src/northstar_api/modules/platform_runtime/**'
      - 'backend/src/northstar_api/modules/super_admin/api/runtime.py'
      - 'backend/tests/test_*platform*.py'
      - 'backend/tests/test_*adaptive*.py'
      - 'backend/tests/test_platform_qualification_gates.py'
      - 'backend/tests/test_platform_dispatch_preflight.py'
      - 'backend/tests/test_platform_approval_integrity.py'
      - 'backend/tests/test_platform_dispatch_event_integrity.py'
      - 'backend/tests/test_platform_execution_report_integrity.py'
      - 'backend/tests/test_platform_deployment_leases.py'
      - 'backend/tests/test_platform_deployment_lease_migration.py'
      - 'backend/tests/test_platform_postgres_deployment_leases.py'
      - 'backend/migrations/versions/0085_platform_deployment_leases.py'
      - 'backend/tests/test_runtime_approval_gates.py'
      - 'backend/tests/test_persisted_desired_state.py'
      - 'backend/tests/test_desired_state_drafts.py'
      - 'backend/tests/test_desired_state_activation.py'
      - 'backend/tests/test_platform_active_revision_index.py'
      - 'backend/tests/test_platform_active_revision_migration.py'
      - 'backend/tests/test_platform_postgres_activation.py'
      - 'backend/tests/test_platform_queue_contract.py'
      - 'backend/migrations/versions/0079_platform_single_active_config.py'
      - 'backend/migrations/versions/0080_platform_durable_jobs.py'
      - 'backend/tests/test_postgres_durable_queue.py'
      - 'backend/tests/test_sqs_queue.py'
      - 'backend/tests/test_rabbitmq_queue.py'
      - 'backend/tests/test_platform_queue_dispatch.py'
      - 'backend/tests/test_platform_queue_replay.py'
      - 'backend/tests/test_platform_queue_replay_api.py'
      - 'backend/tests/test_platform_queue_health.py'
      - 'backend/tests/test_platform_broker_health.py'
      - 'backend/tests/test_platform_sqs_health_api.py'
      - 'backend/tests/test_platform_rabbitmq_health_api.py'
      - 'backend/tests/test_platform_queue_overview.py'
      - 'backend/tests/test_platform_queue_alerts.py'
      - 'backend/tests/test_platform_queue_alert_reconciliation.py'
      - 'backend/tests/test_platform_queue_alert_postgres.py'
      - 'backend/migrations/versions/0082_platform_queue_alert_episodes.py'
      - 'backend/migrations/versions/0083_platform_queue_alert_notifications.py'
      - 'backend/tests/test_platform_queue_notification_admission.py'
      - 'backend/tests/test_platform_queue_notification_dispatch.py'
      - 'backend/migrations/versions/0084_platform_alert_notification_leases.py'
      - 'backend/migrations/versions/0081_platform_queue_dispatch_lease.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  architecture-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    env:
      APP_ENV: test
      DATABASE_URL: sqlite+aiosqlite:///./northstar-test.db
      JWT_SECRET: ci-only-secret-with-at-least-32-characters
      CRM_CREDENTIAL_ENCRYPTION_KEY: ci-only-crm-credential-encryption-key-32chars
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --all-groups --locked
      - run: uv run ruff check src/northstar_api/modules/platform_runtime tests/test_platform_qualification_gates.py tests/test_platform_dispatch_preflight.py tests/test_platform_approval_integrity.py tests/test_platform_dispatch_event_integrity.py tests/test_platform_execution_report_integrity.py tests/test_platform_deployment_leases.py tests/test_platform_deployment_lease_migration.py tests/test_platform_qualification.py tests/test_runtime_approval_gates.py tests/test_persisted_desired_state.py tests/test_desired_state_drafts.py tests/test_desired_state_activation.py tests/test_platform_active_revision_index.py tests/test_platform_active_revision_migration.py tests/test_platform_queue_contract.py tests/test_postgres_durable_queue.py tests/test_sqs_queue.py tests/test_rabbitmq_queue.py tests/test_platform_queue_dispatch.py tests/test_platform_queue_replay.py tests/test_platform_queue_replay_api.py tests/test_platform_queue_health.py tests/test_platform_broker_health.py tests/test_platform_sqs_health_api.py tests/test_platform_rabbitmq_health_api.py tests/test_platform_queue_overview.py tests/test_platform_queue_alerts.py tests/test_platform_queue_alert_reconciliation.py tests/test_platform_queue_notification_admission.py tests/test_platform_queue_notification_dispatch.py
      - run: uv run pytest tests/test_platform_qualification_gates.py tests/test_platform_dispatch_preflight.py tests/test_platform_approval_integrity.py tests/test_platform_dispatch_event_integrity.py tests/test_platform_execution_report_integrity.py tests/test_platform_deployment_leases.py tests/test_platform_deployment_lease_migration.py tests/test_platform_qualification.py tests/test_governed_switches.py tests/test_platform_tiers.py tests/test_adaptive_safety.py tests/test_adaptive_runtime_api.py tests/test_runtime_approval_gates.py tests/test_persisted_desired_state.py tests/test_desired_state_drafts.py tests/test_desired_state_activation.py tests/test_platform_active_revision_index.py tests/test_platform_active_revision_migration.py tests/test_postgres_durable_queue.py tests/test_sqs_queue.py tests/test_rabbitmq_queue.py tests/test_platform_queue_dispatch.py tests/test_platform_queue_replay.py tests/test_platform_queue_replay_api.py tests/test_platform_queue_health.py tests/test_platform_broker_health.py tests/test_platform_sqs_health_api.py tests/test_platform_rabbitmq_health_api.py tests/test_platform_queue_overview.py tests/test_platform_queue_alerts.py tests/test_platform_queue_alert_reconciliation.py tests/test_platform_queue_notification_admission.py tests/test_platform_queue_notification_dispatch.py

  postgres-activation-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: northstar_ci
          POSTGRES_PASSWORD: northstar_ci_only
          POSTGRES_DB: northstar_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U northstar_ci -d northstar_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      APP_ENV: test
      PLATFORM_TEST_POSTGRES_DSN: postgresql://northstar_ci:northstar_ci_only@127.0.0.1:5432/northstar_ci
      DATABASE_URL: postgresql+asyncpg://northstar_ci:northstar_ci_only@127.0.0.1:5432/northstar_ci
      JWT_SECRET: ci-only-secret-with-at-least-32-characters
      CRM_CREDENTIAL_ENCRYPTION_KEY: ci-only-crm-credential-encryption-key-32chars
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --all-groups --locked
      - run: uv run ruff check tests/test_platform_postgres_deployment_leases.py tests/test_platform_queue_alert_postgres.py tests/test_platform_postgres_activation.py tests/test_postgres_durable_queue.py tests/test_platform_queue_replay.py tests/test_platform_queue_replay_api.py
      - run: uv run pytest tests/test_platform_postgres_deployment_leases.py tests/test_platform_queue_alert_postgres.py tests/test_platform_postgres_activation.py -v tests/test_postgres_durable_queue.py
