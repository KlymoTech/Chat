name: Adaptive architecture branch gate

on:
  push:
    branches:
      - feature/northstar-adaptive-architecture-20261008
  pull_request:
    paths:
      - 'backend/src/northstar_api/modules/platform_runtime/**'
      - 'backend/src/northstar_api/modules/super_admin/api/runtime.py'
      - 'backend/tests/test_*platform*.py'
      - 'backend/tests/test_*adaptive*.py'
      - 'backend/tests/test_runtime_approval_gates.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  architecture-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    env:
      APP_ENV: test
      DATABASE_URL: sqlite+aiosqlite:///./northstar-test.db
      JWT_SECRET: ci-only-secret-with-at-least-32-characters
      CRM_CREDENTIAL_ENCRYPTION_KEY: ci-only-crm-credential-encryption-key-32chars
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --all-groups --locked
      - run: uv run ruff check src/northstar_api/modules/platform_runtime tests/test_platform_qualification.py tests/test_runtime_approval_gates.py
      - 'backend/tests/test_persisted_desired_state.py'
      - run: uv run pytest tests/test_platform_qualification.py tests/test_governed_switches.py tests/test_platform_tiers.py tests/test_adaptive_safety.py tests/test_adaptive_runtime_api.py tests/test_runtime_approval_gates.py tests/test_persisted_desired_state.py
