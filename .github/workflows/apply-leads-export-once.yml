# Temporary hash-checked transfer for six existing files; removes itself after applying.
name: Apply Leads export integration
on:
  pull_request:
    paths:
      - '.github/workflows/apply-leads-export-once.yml'
permissions:
  contents: read
jobs:
  apply:
    if: github.event.pull_request.number == 134 && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feat/figma-saas-bot-redesign'
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with: {python-version: '3.12'}
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with: {enable-cache: true, cache-dependency-glob: backend/uv.lock}
      - run: uv sync --all-groups --locked
        working-directory: backend
      - name: Apply reviewed edits only when original and resulting blobs match
        run: |
          python3 - <<'PY'
          import hashlib
          from pathlib import Path
          expected = {
              'backend/migrations/env.py': ('5be0cbff8ee45cf716fd9f65059cb6dfb8a035a0', 'e25b301cc897d7c084f25678c7cc45e184929d48'),
              'backend/src/northstar_api/routers/__init__.py': ('a25a97309cf149b7c51f8cbc575975943b672405', '9e6b7d28447f27d5b46352fb640d0a15152501b0'),
              'backend/src/northstar_api/routers/lead_layout.py': ('737bc460daf896d1a74f53eeb6fce4a2691f17e0', '2109339be7229c81b15b6360621ae7ed0dee1581'),
              'backend/src/northstar_api/routers/leads.py': ('fa1a5c94047e3dc3e945469eeaa37a20876a3232', '2946d29bca3c2aaeba88f6e0e9f023cdbfaef8e8'),
              'frontend/src/components/materialm/MaterialmAppShell.tsx': ('bd3437ffbabe1d114d5dc74b8356e18a56855d9f', '88fd31340fa6a9f766da2634d46625c0386b76d8'),
              'frontend/src/lib/lead-layout-api.ts': ('541533c47a6d6d4fff946bb7d62762d367c7aea1', 'be3b912cc18a7e0688351f83d05ef35b8ee71980'),
          }
          edits = {
              'backend/migrations/env.py': [('    help_models,  # noqa: F401\n    mfa,  # noqa: F401\n', '    help_models,  # noqa: F401\n    lead_workspace_models,  # noqa: F401\n    mfa,  # noqa: F401\n')],
              'backend/src/northstar_api/routers/__init__.py': [
                  ('    lead_layout,\n    leads,\n', '    lead_layout,\n    lead_workspace,\n    leads,\n'),
                  ('api_router.include_router(conversations.router)\napi_router.include_router(lead_layout.router)\n', 'api_router.include_router(conversations.router)\napi_router.include_router(lead_workspace.router)\napi_router.include_router(lead_layout.router)\n')],
              'backend/src/northstar_api/routers/lead_layout.py': [
                  ('from sqlalchemy import or_, select\n\n', 'from sqlalchemy import exists, or_, select\n\nfrom northstar_api.lead_crm.models import LeadProfile\n'),
                  ('    status: str = Query(default="", max_length=40),\n):\n', '    status: str = Query(default="", max_length=40),\n    agent_id: UUID | None = None,\n    channel: str = Query(default="", max_length=60),\n):\n'),
                  ('        conditions.append(Lead.status == status)\n    if search.strip():\n', '        conditions.append(Lead.status == status)\n    if agent_id:\n        conditions.append(Lead.agent_id == agent_id)\n    if channel and channel != "all":\n        conditions.append(exists(select(LeadProfile.id).where(\n            LeadProfile.tenant_id == principal.tenant_id,\n            LeadProfile.lead_id == Lead.id, LeadProfile.source_channel == channel,\n        )))\n    if search.strip():\n')],
              'backend/src/northstar_api/routers/leads.py': [('            Agent.workspace_id == principal.workspace_id,\n        )\n', '            Agent.workspace_id == principal.workspace_id,\n            *((Agent.id.in_(principal.agent_ids),) if principal.agent_ids is not None else ()),\n        )\n')],
              'frontend/src/components/materialm/MaterialmAppShell.tsx': [("${location.pathname === '/conversations' ? ' mm-shell--inbox' : ''}`} style={theme}>", "${location.pathname === '/conversations' ? ' mm-shell--inbox' : ''}${location.pathname === '/leads' ? ' mm-shell--leads' : ''}`} style={theme}>")],
              'frontend/src/lib/lead-layout-api.ts': [
                  ("  export: async (format: 'csv' | 'xlsx', search: string, status: string) => {", "  export: async (format: 'csv' | 'xlsx', search: string, status: string, filters: { agentId?: string; channel?: string } = {}) => {"),
                  ("    const params = new URLSearchParams({ format, search, status });\n", "    const params = new URLSearchParams({ format, search, status });\n    if (filters.agentId && filters.agentId !== 'all') params.set('agent_id', filters.agentId);\n    if (filters.channel && filters.channel !== 'all') params.set('channel', filters.channel);\n")],
          }
          def blob(data):
              return hashlib.sha1(f'blob {len(data)}\0'.encode() + data).hexdigest()
          results = {}
          for path, (before, after) in expected.items():
              data = Path(path).read_bytes()
              assert blob(data) == before, f'Concurrent or unexpected edit: {path}'
              text = data.decode()
              for old, new in edits[path]:
                  assert text.count(old) == 1, f'Ambiguous edit: {path}'
                  text = text.replace(old, new)
              assert blob(text.encode()) == after, f'Transfer mismatch: {path}'
              results[path] = text
          for path, text in results.items():
              Path(path).write_text(text)
          Path('.github/workflows/design-export-review-once.yml').unlink()
          Path('.github/workflows/apply-leads-export-once.yml').unlink()
          PY
      - name: Format only newly added Python files with the repository's locked formatter
        run: |
          backend/.venv/bin/ruff check --select I --fix backend/src/northstar_api/lead_workspace_models.py backend/src/northstar_api/routers/lead_workspace.py backend/tests/test_lead_workspace.py backend/migrations/versions/0079_lead_workspace_operations.py scripts/figma-redesign/leads_browser_review.py
          backend/.venv/bin/ruff format backend/src/northstar_api/lead_workspace_models.py backend/src/northstar_api/routers/lead_workspace.py backend/tests/test_lead_workspace.py backend/migrations/versions/0079_lead_workspace_operations.py scripts/figma-redesign/leads_browser_review.py
      - name: Commit this integration only to the requested feature branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git diff --check
          git add -- backend/migrations/env.py backend/src/northstar_api/routers/__init__.py backend/src/northstar_api/routers/lead_layout.py backend/src/northstar_api/routers/leads.py frontend/src/components/materialm/MaterialmAppShell.tsx frontend/src/lib/lead-layout-api.ts backend/src/northstar_api/lead_workspace_models.py backend/src/northstar_api/routers/lead_workspace.py backend/tests/test_lead_workspace.py backend/migrations/versions/0079_lead_workspace_operations.py scripts/figma-redesign/leads_browser_review.py .github/workflows/design-export-review-once.yml .github/workflows/apply-leads-export-once.yml
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' -c core.hooksPath=/dev/null commit -m 'feat: integrate exported Leads screens with workspace-scoped persistent workflows'
          HEADER=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          echo "::add-mask::$HEADER"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $HEADER" push origin HEAD:refs/heads/feat/figma-saas-bot-redesign
      - name: Capture exact post-transfer source and formatter for isolated verification
        run: |
          mkdir -p /tmp/leads-integrated-source
          git archive --format=tar.gz HEAD > /tmp/leads-integrated-source/source.tar.gz
          git rev-parse HEAD > /tmp/leads-integrated-source/commit.txt
          cp backend/.venv/bin/ruff /tmp/leads-integrated-source/ruff
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: leads-integrated-source
          path: /tmp/leads-integrated-source/
          retention-days: 3
          if-no-files-found: error
