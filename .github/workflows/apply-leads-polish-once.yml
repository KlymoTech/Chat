# Temporary exact-source transfer for PR 134. Deletes itself after one application.
name: Apply verified Leads review fixes
on:
  pull_request:
    paths: ['.github/workflows/apply-leads-polish-once.yml']
permissions:
  contents: read
jobs:
  apply:
    if: github.event.pull_request.number == 134 && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feat/figma-saas-bot-redesign'
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Verify exact old blobs, apply reviewed patch, verify every new blob
        run: |
          python3 - <<'PY'
          import base64, gzip, hashlib, subprocess
          from pathlib import Path
          expected = {
            '.github/workflows/leads-design-review.yml': ('b82046f4e60a659091cc857f1b2d654888742654','031eeee483a16ebe6d0d04340635cafcebe23d6b'),
            'backend/tests/test_lead_workspace.py': ('f8b71d5350fad6503630b546d4072dec04787c02','ee088ae387190e211eab7458220a60ef00896674'),
            'frontend/src/features/leads/LeadDialogs.tsx': ('6a000c8f9afe9aadb8ee7121a11e61e5ddcdf3dd','93af2f45b552c421a4224f17b1f57b04101b7f19'),
            'frontend/src/features/leads/leads.css': ('2da8f4b65e273be193d8f42388c4e8d37a25b101','bbb8c02ece9eab99560eaf38c88e54bcb1f9f40c'),
            'frontend/src/features/leads/presentation.ts': ('198a4f20716834eae82bd923246672fcbbd5cac0','7669313e0cd890bfb4db17e83a34260c9a63f87c'),
            'frontend/src/features/leads/presentation.test.ts': ('36aaed0207ac16d9b42f00f082919ca2e338f408','e4e3cd7378b74bf3fb3aa8126603bd5079614550'),
            'frontend/src/pages/LeadsPage.tsx': ('a41c5e92e29cb36c5c5b76930b99d6bb0fb10e37','bb37440a80ce3810e9e2722fe66c373d03f9c72a'),
            'scripts/figma-redesign/leads_browser_review.py': ('7bdc841f95eba64f048cb36308015d5884f432d0','dc6f89dbc86fec829d968e20a792dccfa3055d21'),
            'scripts/figma-redesign/leads_migration_review.py': (None,'e771ceac700efcee23c12a770d8dc583bdb9c851'),
          }
          def blob(path):
              value = Path(path).read_bytes()
              return hashlib.sha1(f'blob {len(value)}\0'.encode() + value).hexdigest()
          for path, (before, _) in expected.items():
              assert (blob(path) if Path(path).exists() else None) == before, f'Concurrent edit: {path}'
          encoded = ''
          patch = gzip.decompress(base64.b64decode(encoded))
          assert hashlib.sha256(patch).hexdigest() == '825865ebc9f21fd4c1fd64621d58271e12f85daddb9e52b7165863dd731c49cd'
          subprocess.run(['git','apply','--check','-'], input=patch, check=True)
          subprocess.run(['git','apply','-'], input=patch, check=True)
          for path, (_, after) in expected.items():
              assert blob(path) == after, f'Post-transfer mismatch: {path}'
          own = '.github/workflows/apply-leads-polish-once.yml'
          Path(own).unlink()
          subprocess.run(['git','add','--',*expected,own],check=True)
          PY
      - name: Commit and fast-forward only the requested feature branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git diff --cached --check
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' -c core.hooksPath=/dev/null commit -m 'fix: polish Leads export layout, reconcile fresh records and verify PostgreSQL migration'
          HEADER=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          echo "::add-mask::$HEADER"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $HEADER" push origin HEAD:refs/heads/feat/figma-saas-bot-redesign
