# Temporary read-only review snapshot; remove after the design continuation.
name: Design bundle isolated source review
on:
  pull_request:
    paths: ['.github/workflows/design-bundle-source-once.yml']
permissions:
  contents: read
jobs:
  snapshot:
    if: github.event.pull_request.number == 134 && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feat/figma-saas-bot-redesign'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with: {node-version: '22', cache: npm}
      - run: npm ci --no-audit --no-fund
      - name: Archive tracked source and installed public dependencies only
        run: |
          set -euo pipefail
          mkdir -p /tmp/design-bundle-source
          git archive --format=tar.gz HEAD > /tmp/design-bundle-source/source.tar.gz
          git rev-parse HEAD > /tmp/design-bundle-source/commit.txt
          tar -czf /tmp/design-bundle-source/dependencies.tar.gz node_modules frontend/node_modules
          cp "$(command -v node)" /tmp/design-bundle-source/node
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: design-bundle-source
          path: /tmp/design-bundle-source/
          retention-days: 3
          if-no-files-found: error
