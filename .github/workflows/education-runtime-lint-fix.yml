name: Education Runtime One-Time Lint Fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix-runtime-style:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Normalize Runtime Authorization Python style with Ruff
        run: |
          python -m pip install --disable-pip-version-check --quiet ruff==0.16.6
          ruff check --fix backend/src/northstar_api/services/education_runtime_authorization.py backend/src/northstar_api/workers/channel_event_consumer.py backend/tests/test_education_runtime_authorization.py backend/tests/test_education_channel_runtime.py
          ruff format backend/src/northstar_api/services/education_runtime_authorization.py backend/src/northstar_api/workers/channel_event_consumer.py backend/tests/test_education_runtime_authorization.py backend/tests/test_education_channel_runtime.py
      - name: Commit Runtime Authorization style corrections
        run: |
          if git diff --quiet; then
            echo "No changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/src/northstar_api/services/education_runtime_authorization.py backend/src/northstar_api/workers/channel_event_consumer.py backend/tests/test_education_runtime_authorization.py backend/tests/test_education_channel_runtime.py
          git commit -m "style: normalize education runtime authorization"
          git push origin HEAD:main
