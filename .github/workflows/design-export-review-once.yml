# Temporary read-only capture for the user-supplied design export implementation.
name: Design export review snapshot
on:
  pull_request:
    paths:
      - '.github/workflows/design-export-review-once.yml'
permissions:
  contents: read
jobs:
  snapshot:
    if: github.event.pull_request.number == 134 && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feat/figma-saas-bot-redesign'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with: {node-version: '22', cache: npm}
      - run: npm ci --no-audit --no-fund
      - name: Archive tracked source and non-secret build tools only
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/design-export-review
          git archive --format=tar.gz "$HEAD_SHA" > /tmp/design-export-review/head.tar.gz
          git archive --format=tar.gz "$BASE_SHA" > /tmp/design-export-review/base.tar.gz
          tar -czf /tmp/design-export-review/frontend-tools.tar.gz node_modules frontend/node_modules
          cp "$(command -v node)" /tmp/design-export-review/node
          printf '{"head":"%s","base":"%s"}\n' "$HEAD_SHA" "$BASE_SHA" > /tmp/design-export-review/commits.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: design-export-review-snapshot
          path: /tmp/design-export-review/
          retention-days: 3
          if-no-files-found: error
