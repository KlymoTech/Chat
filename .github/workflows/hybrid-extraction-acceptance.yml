name: Hybrid extraction acceptance

on:
  push:
    branches: [feature/hybrid-extraction-source-verification]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Archive tracked source for isolated implementation verification
        run: git archive --format=tar.gz HEAD -o source-snapshot.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: hybrid-extraction-source-snapshot
          path: source-snapshot.tar.gz
          retention-days: 1
          if-no-files-found: error
