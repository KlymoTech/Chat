name: Education Runtime One-Time Wiring

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  wire-runtime:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Insert Education authorization branch before Lead routing
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('backend/src/northstar_api/workers/channel_event_consumer.py')
          content = path.read_text(encoding='utf-8')

          old = 'from northstar_api.config import get_settings\n'
          new = 'from northstar_api.agent_purpose import AgentPurpose, get_agent_purpose\nfrom northstar_api.config import get_settings\n'
          if old not in content:
              raise SystemExit('config import anchor not found')
          content = content.replace(old, new, 1)

          old = 'from northstar_api.services.outbox import enqueue_event\n'
          new = '''from northstar_api.services.education_runtime_authorization import (\n    EducationAccessDecision,\n    EducationAccessReason,\n    authorize_education_access,\n    identity_candidate_for_event,\n)\nfrom northstar_api.services.outbox import enqueue_event\n'''
          if old not in content:
              raise SystemExit('service import anchor not found')
          content = content.replace(old, new, 1)

          marker = '\n\nasync def _process_event(session: AsyncSession, event: EventEnvelope) -> None:\n'
          if marker not in content:
              raise SystemExit('process event anchor not found')
          helper = '''\n\nasync def _process_education_message(\n    session: AsyncSession,\n    *,\n    raw: RawWebhookEvent,\n    connection: ChannelConnection,\n    canonical: CanonicalInboundEvent,\n    agent: Agent,\n) -> None:\n    identity, mapping_reason = identity_candidate_for_event(\n        canonical,\n        allow_unsigned_widget=bool(connection.configuration_json.get("allowUnsigned", False)),\n    )\n    if identity is None:\n        decision = EducationAccessDecision(\n            authorized=False,\n            reason=mapping_reason or EducationAccessReason.IDENTITY_MISSING,\n            agent_id=agent.id,\n            workspace_id=agent.workspace_id,\n        )\n    else:\n        decision = await authorize_education_access(\n            session,\n            tenant_id=canonical.tenant_id,\n            workspace_id=agent.workspace_id,\n            agent=agent,\n            identity=identity,\n        )\n\n    conversation: Conversation | None = None\n    if decision.authorized:\n        conversation = await _get_or_create_conversation(session, event=canonical, agent=agent)\n        await _persist_message(session, event=canonical, conversation=conversation)\n\n    access_payload = {\n        **decision.event_payload(),\n        "rawEventId": str(raw.id),\n        "provider": canonical.provider.value,\n        "conversationId": str(conversation.id) if conversation else None,\n    }\n    enqueue_event(\n        session,\n        tenant_id=canonical.tenant_id,\n        aggregate_type="education_enrollment" if decision.enrollment_id else "agent",\n        aggregate_id=decision.enrollment_id or agent.id,\n        event_type=(\n            "education.access.authorized.v1"\n            if decision.authorized\n            else "education.access.denied.v1"\n        ),\n        payload=access_payload,\n    )\n\n    raw.processing_status = "processed"\n    raw.processed_at = datetime.now(UTC)\n    raw.attempt_count += 1\n    enqueue_event(\n        session,\n        tenant_id=canonical.tenant_id,\n        aggregate_type="raw_webhook_event",\n        aggregate_id=raw.id,\n        event_type="channel.event.processed.v1",\n        payload={\n            "rawEventId": str(raw.id),\n            "provider": canonical.provider.value,\n            "leadId": None,\n            "conversationId": str(conversation.id) if conversation else None,\n            "educationAccess": decision.event_payload(),\n        },\n    )\n    await session.commit()\n'''
          content = content.replace(marker, helper + marker, 1)

          old = '''    if not agent:\n        raise ValueError("channel connection agent does not exist in tenant scope")\n\n    conversation = await _get_or_create_conversation(session, event=canonical, agent=agent)\n'''
          new = '''    if not agent:\n        raise ValueError("channel connection agent does not exist in tenant scope")\n\n    purpose = await get_agent_purpose(\n        session,\n        tenant_id=event.tenant_id,\n        workspace_id=agent.workspace_id,\n        agent_id=agent.id,\n    )\n    if purpose is AgentPurpose.EDUCATION:\n        await _process_education_message(\n            session,\n            raw=raw,\n            connection=connection,\n            canonical=canonical,\n            agent=agent,\n        )\n        return\n\n    conversation = await _get_or_create_conversation(session, event=canonical, agent=agent)\n'''
          if old not in content:
              raise SystemExit('agent-to-conversation anchor not found')
          content = content.replace(old, new, 1)

          path.write_text(content, encoding='utf-8')
          PY
      - name: Format touched runtime files
        run: |
          python -m pip install --disable-pip-version-check --quiet ruff==0.15.7
          ruff format backend/src/northstar_api/workers/channel_event_consumer.py backend/src/northstar_api/services/education_runtime_authorization.py backend/tests/test_education_runtime_authorization.py
      - name: Commit Education runtime wiring
        run: |
          if git diff --quiet; then
            echo "No changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/src/northstar_api/workers/channel_event_consumer.py backend/src/northstar_api/services/education_runtime_authorization.py backend/tests/test_education_runtime_authorization.py
          git commit -m "feat: authorize education messages before lead routing"
          git push origin HEAD:main
