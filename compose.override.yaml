services:
  api:
    environment:
      EMAIL_DELIVERY_MODE: ${EMAIL_DELIVERY_MODE:-log}
      EMAIL_FROM_ADDRESS: ${EMAIL_FROM_ADDRESS:-no-reply@northstar.local}
      EMAIL_FROM_NAME: ${EMAIL_FROM_NAME:-Northstar}
      EMAIL_VERIFICATION_FRONTEND_URL: ${EMAIL_VERIFICATION_FRONTEND_URL:-http://localhost:3000/verify-email}
      EMAIL_VERIFICATION_TTL_HOURS: ${EMAIL_VERIFICATION_TTL_HOURS:-24}
      PASSWORD_RESET_FRONTEND_URL: ${PASSWORD_RESET_FRONTEND_URL:-http://localhost:3000/reset-password}
      PASSWORD_RESET_TTL_MINUTES: ${PASSWORD_RESET_TTL_MINUTES:-60}
      WORKSPACE_INVITATION_FRONTEND_URL: ${WORKSPACE_INVITATION_FRONTEND_URL:-http://localhost:3000/workspace-invitation}
      WORKSPACE_INVITATION_TTL_DAYS: ${WORKSPACE_INVITATION_TTL_DAYS:-7}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-true}
      SMTP_SSL: ${SMTP_SSL:-false}
      SMTP_TIMEOUT_SECONDS: ${SMTP_TIMEOUT_SECONDS:-10}

  notification-consumer:
    image: northstar/api:${IMAGE_TAG:-local}
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: ["python", "-m", "northstar_api.workers.notification_consumer"]
    environment:
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: ${WORKER_DATABASE_URL:-postgresql+asyncpg://northstar_service:replace-local-postgres-service-password@postgres:5432/northstar}
      DATABASE_APPLY_RUNTIME_ROLE: "false"
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
      KAFKA_ENABLED: ${KAFKA_ENABLED:-true}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_JSON: ${LOG_JSON:-true}
      OTEL_SERVICE_NAME: northstar-notification-consumer
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    depends_on:
      migrate:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
    networks:
      - data
      - events
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256
    healthcheck:
      disable: true
