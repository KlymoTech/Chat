services:
  api:
    environment:
      EMAIL_DELIVERY_MODE: ${EMAIL_DELIVERY_MODE:-log}
      EMAIL_FROM_ADDRESS: ${EMAIL_FROM_ADDRESS:-no-reply@northstar.local}
      EMAIL_FROM_NAME: ${EMAIL_FROM_NAME:-Northstar}
      EMAIL_VERIFICATION_FRONTEND_URL: ${EMAIL_VERIFICATION_FRONTEND_URL:-http://localhost:3000/verify-email}
      EMAIL_VERIFICATION_TTL_HOURS: ${EMAIL_VERIFICATION_TTL_HOURS:-24}
      PASSWORD_RESET_FRONTEND_URL: ${PASSWORD_RESET_FRONTEND_URL:-http://localhost:3000/reset-password}
      PASSWORD_RESET_TTL_MINUTES: ${PASSWORD_RESET_TTL_MINUTES:-60}
      WORKSPACE_INVITATION_FRONTEND_URL: ${WORKSPACE_INVITATION_FRONTEND_URL:-http://localhost:3000/workspace-invitation}
      WORKSPACE_INVITATION_TTL_DAYS: ${WORKSPACE_INVITATION_TTL_DAYS:-7}
      PLATFORM_ADMIN_EMAILS: '${PLATFORM_ADMIN_EMAILS:-[]}'
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-true}
      SMTP_SSL: ${SMTP_SSL:-false}
      SMTP_TIMEOUT_SECONDS: ${SMTP_TIMEOUT_SECONDS:-10}
      CRM_OAUTH_PUBLIC_BASE_URL: ${CRM_OAUTH_PUBLIC_BASE_URL:-http://localhost:8100}
      CRM_OAUTH_FRONTEND_ORIGIN: ${CRM_OAUTH_FRONTEND_ORIGIN:-http://localhost:3100}
      CRM_ZOHO_CLIENT_ID: ${CRM_ZOHO_CLIENT_ID:-}
      CRM_ZOHO_CLIENT_SECRET: ${CRM_ZOHO_CLIENT_SECRET:-}
      CRM_SALESFORCE_CLIENT_ID: ${CRM_SALESFORCE_CLIENT_ID:-}
      CRM_SALESFORCE_CLIENT_SECRET: ${CRM_SALESFORCE_CLIENT_SECRET:-}
      CRM_HUBSPOT_CLIENT_ID: ${CRM_HUBSPOT_CLIENT_ID:-}
      CRM_HUBSPOT_CLIENT_SECRET: ${CRM_HUBSPOT_CLIENT_SECRET:-}
      CRM_DYNAMICS365_CLIENT_ID: ${CRM_DYNAMICS365_CLIENT_ID:-}
      CRM_DYNAMICS365_CLIENT_SECRET: ${CRM_DYNAMICS365_CLIENT_SECRET:-}
      CRM_PIPEDRIVE_CLIENT_ID: ${CRM_PIPEDRIVE_CLIENT_ID:-}
      CRM_PIPEDRIVE_CLIENT_SECRET: ${CRM_PIPEDRIVE_CLIENT_SECRET:-}

  migrate:
    command: ["alembic", "upgrade", "heads"]

  notification-consumer:
    extends:
      file: compose.yaml
      service: analytics-consumer
    command: ["python", "-m", "northstar_api.workers.notification_consumer"]
    environment:
      OTEL_SERVICE_NAME: northstar-notification-consumer
