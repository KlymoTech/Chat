name: ${COMPOSE_PROJECT_NAME:-northstar-ai}

x-api-build: &api-build
  context: ./backend
  dockerfile: Dockerfile

x-api-environment: &api-environment
  APP_ENV: ${APP_ENV:-development}
  APP_HOST: 0.0.0.0
  APP_PORT: 8000
  APP_API_PREFIX: /api/v1
  APP_AUTO_CREATE_SCHEMA: ${APP_AUTO_CREATE_SCHEMA:-false}
  APP_CORS_ORIGINS: '${APP_CORS_ORIGINS:-["http://localhost:3000","http://127.0.0.1:3000"]}'
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  LOG_JSON: ${LOG_JSON:-true}
  PYTHONUNBUFFERED: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  JWT_SECRET: ${JWT_SECRET:-replace-with-at-least-32-random-characters}
  JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
  JWT_ISSUER: ${JWT_ISSUER:-northstar-api}
  JWT_AUDIENCE: ${JWT_AUDIENCE:-northstar-web}
  JWT_ACCESS_TTL_MINUTES: ${JWT_ACCESS_TTL_MINUTES:-15}
  JWT_REFRESH_TTL_DAYS: ${JWT_REFRESH_TTL_DAYS:-14}
  SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-}
  SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}
  SEED_ADMIN_NAME: ${SEED_ADMIN_NAME:-Workspace Owner}
  SEED_TENANT_NAME: ${SEED_TENANT_NAME:-Northstar Workspace}
  SEED_DEMO_AGENT: ${SEED_DEMO_AGENT:-false}
  ALLOW_PRODUCTION_SEED: ${ALLOW_PRODUCTION_SEED:-false}
  DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://northstar_app:replace-local-postgres-runtime-password@postgres:5432/northstar}
  DATABASE_RUNTIME_ROLE: ${DATABASE_RUNTIME_ROLE:-northstar_app}
  DATABASE_APPLY_RUNTIME_ROLE: ${DATABASE_APPLY_RUNTIME_ROLE:-true}
  DATABASE_POOL_SIZE: ${DATABASE_POOL_SIZE:-10}
  DATABASE_MAX_OVERFLOW: ${DATABASE_MAX_OVERFLOW:-20}
  REDIS_URL: ${REDIS_URL:-redis://:replace-local-redis-password@redis:6379/0}
  REDIS_CONNECT_TIMEOUT_SECONDS: ${REDIS_CONNECT_TIMEOUT_SECONDS:-0.5}
  REDIS_SOCKET_TIMEOUT_SECONDS: ${REDIS_SOCKET_TIMEOUT_SECONDS:-1.0}
  RABBITMQ_URL: ${RABBITMQ_URL:-amqp://northstar:replace-local-rabbitmq-password@rabbitmq:5672/northstar}
  KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
  KAFKA_ENABLED: ${KAFKA_ENABLED:-true}
  BACKGROUND_DISPATCH_ENABLED: ${BACKGROUND_DISPATCH_ENABLED:-true}
  S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-http://minio:9000}
  S3_PUBLIC_ENDPOINT_URL: ${S3_PUBLIC_ENDPOINT_URL:-http://localhost:9000}
  S3_BUCKET: ${S3_BUCKET:-northstar-knowledge}
  S3_REGION: ${S3_REGION:-us-east-1}
  S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-northstar}
  S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-replace-local-minio-password}
  S3_PRESIGN_TTL_SECONDS: ${S3_PRESIGN_TTL_SECONDS:-900}
  UPLOAD_MAX_BYTES: ${UPLOAD_MAX_BYTES:-26214400}
  KNOWLEDGE_MAX_EXTRACTED_CHARACTERS: ${KNOWLEDGE_MAX_EXTRACTED_CHARACTERS:-2000000}
  KNOWLEDGE_MAX_CHUNKS: ${KNOWLEDGE_MAX_CHUNKS:-2000}
  KNOWLEDGE_MAX_PDF_PAGES: ${KNOWLEDGE_MAX_PDF_PAGES:-500}
  KNOWLEDGE_SITEMAP_MAX_URLS: ${KNOWLEDGE_SITEMAP_MAX_URLS:-25}
  KNOWLEDGE_MAX_DOCX_UNCOMPRESSED_BYTES: ${KNOWLEDGE_MAX_DOCX_UNCOMPRESSED_BYTES:-104857600}
  NVIDIA_API_KEY: ${NVIDIA_API_KEY:-}
  NVIDIA_BASE_URL: ${NVIDIA_BASE_URL:-https://integrate.api.nvidia.com/v1}
  NVIDIA_MODEL: ${NVIDIA_MODEL:-nvidia/nemotron-3-ultra-550b-a55b}
  NVIDIA_TEMPERATURE: ${NVIDIA_TEMPERATURE:-1}
  NVIDIA_TOP_P: ${NVIDIA_TOP_P:-0.95}
  NVIDIA_MAX_TOKENS: ${NVIDIA_MAX_TOKENS:-16384}
  NVIDIA_ENABLE_THINKING: ${NVIDIA_ENABLE_THINKING:-true}
  NVIDIA_EMBEDDING_MODEL: ${NVIDIA_EMBEDDING_MODEL:-nvidia/nemotron-3-embed-1b}
  EMBEDDING_DIMENSION: ${EMBEDDING_DIMENSION:-2048}
  META_APP_ID: ${META_APP_ID:-}
  META_APP_SECRET: ${META_APP_SECRET:-}
  META_WHATSAPP_CONFIGURATION_ID: ${META_WHATSAPP_CONFIGURATION_ID:-}
  META_WHATSAPP_WEBHOOK_VERIFY_TOKEN: ${META_WHATSAPP_WEBHOOK_VERIFY_TOKEN:-}
  META_WHATSAPP_TOKEN_ENCRYPTION_KEY: ${META_WHATSAPP_TOKEN_ENCRYPTION_KEY:-}
  META_GRAPH_API_VERSION: ${META_GRAPH_API_VERSION:-v26.0}
  META_GRAPH_BASE_URL: ${META_GRAPH_BASE_URL:-https://graph.facebook.com}
  META_WEBHOOK_MAX_BYTES: ${META_WEBHOOK_MAX_BYTES:-1048576}
  META_SIGNUP_SESSION_TTL_SECONDS: ${META_SIGNUP_SESSION_TTL_SECONDS:-600}
  WHATSAPP_DISPATCH_MAX_ATTEMPTS: ${WHATSAPP_DISPATCH_MAX_ATTEMPTS:-8}
  CRM_CREDENTIAL_ENCRYPTION_KEY: ${CRM_CREDENTIAL_ENCRYPTION_KEY:-replace-with-at-least-32-random-characters-for-crm}
  STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
  STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
  STRIPE_PRICE_STARTER: ${STRIPE_PRICE_STARTER:-}
  STRIPE_PRICE_PROFESSIONAL: ${STRIPE_PRICE_PROFESSIONAL:-}
  STRIPE_PRICE_BUSINESS: ${STRIPE_PRICE_BUSINESS:-}
  STRIPE_PRICE_ENTERPRISE: ${STRIPE_PRICE_ENTERPRISE:-}
  STRIPE_CHECKOUT_SUCCESS_URL: ${STRIPE_CHECKOUT_SUCCESS_URL:-http://localhost:3000/settings?billing=success}
  STRIPE_CHECKOUT_CANCEL_URL: ${STRIPE_CHECKOUT_CANCEL_URL:-http://localhost:3000/settings?billing=cancelled}
  STRIPE_PORTAL_RETURN_URL: ${STRIPE_PORTAL_RETURN_URL:-http://localhost:3000/settings}
  STRIPE_API_BASE_URL: ${STRIPE_API_BASE_URL:-https://api.stripe.com}
  STRIPE_TIMEOUT_SECONDS: ${STRIPE_TIMEOUT_SECONDS:-10}
  STRIPE_WEBHOOK_TOLERANCE_SECONDS: ${STRIPE_WEBHOOK_TOLERANCE_SECONDS:-300}
  STRIPE_WEBHOOK_MAX_BYTES: ${STRIPE_WEBHOOK_MAX_BYTES:-1048576}
  REQUIRE_NVIDIA: ${REQUIRE_NVIDIA:-false}
  ALLOW_DETERMINISTIC_EMBEDDINGS: ${ALLOW_DETERMINISTIC_EMBEDDINGS:-true}
  RATE_LIMIT_FAIL_OPEN: ${RATE_LIMIT_FAIL_OPEN:-true}
  DEFAULT_RATE_LIMIT_PER_MINUTE: ${DEFAULT_RATE_LIMIT_PER_MINUTE:-30}
  LOGIN_RATE_LIMIT_PER_MINUTE: ${LOGIN_RATE_LIMIT_PER_MINUTE:-8}
  LOGIN_GLOBAL_RATE_LIMIT_PER_MINUTE: ${LOGIN_GLOBAL_RATE_LIMIT_PER_MINUTE:-120}
  LOGIN_HASH_CONCURRENCY: ${LOGIN_HASH_CONCURRENCY:-4}
  AGENT_GLOBAL_RATE_LIMIT_PER_MINUTE: ${AGENT_GLOBAL_RATE_LIMIT_PER_MINUTE:-120}
  WIDGET_SESSION_RATE_LIMIT_PER_MINUTE: ${WIDGET_SESSION_RATE_LIMIT_PER_MINUTE:-60}
  MODEL_CONCURRENCY_PER_PROCESS: ${MODEL_CONCURRENCY_PER_PROCESS:-16}
  MAXIMUM_MESSAGE_CHARACTERS: ${MAXIMUM_MESSAGE_CHARACTERS:-12000}
  RETRIEVAL_CANDIDATE_LIMIT: ${RETRIEVAL_CANDIDATE_LIMIT:-40}
  RETRIEVAL_CONTEXT_LIMIT: ${RETRIEVAL_CONTEXT_LIMIT:-8}
  RETRIEVAL_MIN_SCORE: ${RETRIEVAL_MIN_SCORE:-0.20}

x-json-logging: &json-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

x-api-runtime: &api-runtime
  image: northstar/api:${IMAGE_TAG:-local}
  build: *api-build
  environment: *api-environment
  init: true
  restart: unless-stopped
  stop_grace_period: 30s
  logging: *json-logging
  read_only: true
  tmpfs:
    - /tmp:size=256m,mode=1777
  cap_drop:
    - ALL
  pids_limit: 512

services:
  web:
    image: northstar/web:${IMAGE_TAG:-local}
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-/api/v1}
        VITE_DEMO_MODE: ${VITE_DEMO_MODE:-false}
        # The renderer verifies this exact public upload origin is present in
        # WEB_CSP_EXTRA_CONNECT_SRC, failing the image build on configuration drift.
        S3_PUBLIC_ENDPOINT_URL: "${S3_PUBLIC_ENDPOINT_URL:-http://localhost:9000}"
        # Cover the documented local port and the no-.env fallback. Custom
        # object-store origins must set WEB_CSP_EXTRA_CONNECT_SRC explicitly.
        WEB_CSP_EXTRA_CONNECT_SRC: "${WEB_CSP_EXTRA_CONNECT_SRC:-http://localhost:9000 http://127.0.0.1:9000 http://localhost:9010 http://127.0.0.1:9010}"
    user: "101:101"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /var/cache/nginx:size=32m,mode=1777
      - /var/run:size=4m,mode=1777
      - /tmp:size=16m,mode=1777
    ports:
      - "${WEB_BIND_ADDRESS:-127.0.0.1}:${WEB_PORT:-3000}:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:80/healthz"]
      interval: 15s
      timeout: 3s
      retries: 5
    logging: *json-logging
    networks:
      - edge

  api:
    <<: *api-runtime
    user: "10001:10001"
    command: ["uvicorn", "northstar_api.main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "2"]
    ports:
      - "${API_BIND_ADDRESS:-127.0.0.1}:${API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      kafka:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2).read()",
        ]
      interval: 15s
      timeout: 4s
      retries: 10
      start_period: 20s
    networks:
      - edge
      - private

  migrations:
    image: northstar/api:${IMAGE_TAG:-local}
    build: *api-build
    user: "10001:10001"
    restart: "no"
    command: ["sh", "-c", "alembic upgrade head"]
    environment:
      <<: *api-environment
      DATABASE_URL: ${MIGRATION_DATABASE_URL:-postgresql+asyncpg://northstar:replace-local-postgres-password@postgres:5432/northstar}
      DATABASE_APPLY_RUNTIME_ROLE: "false"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - private

  outbox-publisher:
    <<: *api-runtime
    user: "10001:10001"
    command: ["northstar-outbox"]
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - private

  analytics-consumer:
    <<: *api-runtime
    user: "10001:10001"
    command: ["northstar-analytics"]
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - private

  notifications-consumer:
    <<: *api-runtime
    user: "10001:10001"
    command: ["northstar-notifications"]
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - private

  object-cleaner:
    <<: *api-runtime
    user: "10001:10001"
    command: ["northstar-object-cleaner"]
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - private

  crm-router:
    <<: *api-runtime
    user: "10001:10001"
    command: ["northstar-crm-router"]
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - private

  crm-delivery:
    <<: *api-runtime
    user: "10001:10001"
    command: ["northstar-crm-delivery"]
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - private

  crm-reconciliation:
    <<: *api-runtime
    user: "10001:10001"
    command: ["northstar-crm-reconciliation"]
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - private

  crm-webhooks:
    <<: *api-runtime
    user: "10001:10001"
    command: ["northstar-crm-webhooks"]
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - private

  channel-router:
    <<: *api-runtime
    user: "10001:10001"
    command: ["northstar-channel-router"]
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - private

  celery-worker:
    <<: *api-runtime
    user: "10001:10001"
    command:
      [
        "celery",
        "-A",
        "northstar_api.workers.celery_app:celery_app",
        "worker",
        "--loglevel=INFO",
        "--concurrency=${CELERY_CONCURRENCY:-2}",
        "-Q",
        "jobs,whatsapp.outbound,whatsapp.failed,telegram.outbound,telegram.failed,instagram.outbound,instagram.failed,facebook_messenger.outbound,facebook_messenger.failed,slack.outbound,slack.failed",
      ]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - private

  job-dispatcher:
    <<: *api-runtime
    user: "10001:10001"
    command: ["northstar-job-dispatcher"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - private

  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-northstar}
      POSTGRES_USER: ${POSTGRES_USER:-northstar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-replace-local-postgres-password}
      POSTGRES_RUNTIME_USER: ${POSTGRES_RUNTIME_USER:-northstar_app}
      POSTGRES_RUNTIME_PASSWORD: ${POSTGRES_RUNTIME_PASSWORD:-replace-local-postgres-runtime-password}
      POSTGRES_SERVICE_USER: ${POSTGRES_SERVICE_USER:-northstar_service}
      POSTGRES_SERVICE_PASSWORD: ${POSTGRES_SERVICE_PASSWORD:-replace-local-postgres-service-password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "${POSTGRES_BIND_ADDRESS:-127.0.0.1}:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-northstar} -d ${POSTGRES_DB:-northstar}"]
      interval: 5s
      timeout: 3s
      retries: 20
    logging: *json-logging
    networks:
      - private

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command:
      [
        "redis-server",
        "--appendonly",
        "yes",
        "--requirepass",
        "${REDIS_PASSWORD:-replace-local-redis-password}",
        "--maxmemory",
        "256mb",
        "--maxmemory-policy",
        "allkeys-lru",
      ]
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_BIND_ADDRESS:-127.0.0.1}:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $$REDIS_PASSWORD ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-replace-local-redis-password}
    logging: *json-logging
    networks:
      - private

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    restart: unless-stopped
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-northstar}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-replace-local-rabbitmq-password}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_DEFAULT_VHOST:-northstar}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    ports:
      - "${RABBITMQ_BIND_ADDRESS:-127.0.0.1}:${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_BIND_ADDRESS:-127.0.0.1}:${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 20
    logging: *json-logging
    networks:
      - private

  kafka:
    image: bitnami/kafka:3.9
    restart: unless-stopped
    environment:
      KAFKA_ENABLE_KRAFT: "yes"
      KAFKA_CFG_NODE_ID: 1
      KAFKA_CFG_PROCESS_ROLES: broker,controller
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CFG_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_CFG_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_CFG_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_CFG_LOG_RETENTION_HOURS: 168
      KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
      KAFKA_CLUSTER_ID: ${KAFKA_CLUSTER_ID:-4L6g3nShT-eMCtK--X86sw}
    volumes:
      - kafka_data:/bitnami/kafka
    ports:
      - "${KAFKA_BIND_ADDRESS:-127.0.0.1}:${KAFKA_HOST_PORT:-29092}:9092"
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 30
    logging: *json-logging
    networks:
      - private

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-northstar}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-replace-local-minio-password}
      MINIO_BROWSER_REDIRECT_URL: ${MINIO_BROWSER_REDIRECT_URL:-http://localhost:9001}
    volumes:
      - minio_data:/data
    ports:
      - "${MINIO_BIND_ADDRESS:-127.0.0.1}:${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_BIND_ADDRESS:-127.0.0.1}:${MINIO_CONSOLE_PORT:-9001}:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20
    logging: *json-logging
    networks:
      - private

networks:
  edge:
  private:
    internal: true

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
  kafka_data:
  minio_data:
